StylesPath = .vale
MinAlertLevel = warning

Vocab = Trusset

# Parse MDX as Markdown. Vale's native MDX support needs the mdx2vast npm
# package; mapping the extension keeps CI to a single binary with no Node
# dependency. The tradeoff is that JSX attribute text is linted as prose,
# which is what we want anyway: a banned word inside a <Card> still ships.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Trusset

# ---------------------------------------------------------------------------
# Meta-documents. These files quote the rules in order to state them.
# ---------------------------------------------------------------------------

[docs/STYLEGUIDE.md]
Trusset.BannedWords = NO
Trusset.FirstPerson = NO
Trusset.Terminology = NO
Trusset.LendingModule = NO
Trusset.SettlementToken = NO

[docs/INVENTORY.md]
Trusset.BannedWords = NO
Trusset.FirstPerson = NO
Trusset.Terminology = NO
Trusset.LendingModule = NO

# Quotes the violating text in order to audit it.
[docs/PASS-3-INVENTORY.md]
Trusset.BannedWords = NO
Trusset.FirstPerson = NO
Trusset.Terminology = NO
Trusset.LendingModule = NO
Trusset.SettlementToken = NO

[docs/OPEN-QUESTIONS.md]
Trusset.BannedWords = NO
Trusset.FirstPerson = NO
Trusset.Terminology = NO
Trusset.LendingModule = NO
Trusset.SettlementToken = NO

# ---------------------------------------------------------------------------
# Tier 1 exceptions. These are NOT style exemptions. Each one marks a real
# violation that the sentence lock forbids fixing in a style pass, and each is
# written up in docs/OPEN-QUESTIONS.md with what is needed to clear it.
# Delete the exception the moment the underlying sentence is re-approved.
# ---------------------------------------------------------------------------

# OPEN-QUESTIONS item 7: four sentences say "we" for Trusset inside, or beside,
# locked negative capability claims. The lock outranks the style rule until
# someone with authority to restate the claim restates it.
[protocol/infrastructure/custody.mdx]
Trusset.FirstPerson = NO

[protocol/infrastructure/data-storage.mdx]
Trusset.FirstPerson = NO

[protocol/infrastructure/core-infrastructure.mdx]
Trusset.FirstPerson = NO

# Tier 1: "settlement token" appears twice and the gloss cannot be added
# without rewording. Logged as part of OPEN-QUESTIONS item 4's scope decision.
[endpoints/lending/introduction.mdx]
Trusset.SettlementToken = NO

# OPEN-QUESTIONS item 11: "Gesetz uber elektronische Wertpapiere" misspells the
# statute name under either spelling convention. The sentence cites eWpG, so it
# is locked byte for byte and the correction needs sign-off.
[licenses/stocks/introduction.mdx]
Trusset.Terminology = NO
