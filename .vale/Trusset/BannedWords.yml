extends: existence
message: "'%s' is on the banned list. See docs/STYLEGUIDE.md."
level: error
ignorecase: true
tokens:
  - 'in today.s landscape'
  - 'it is important to note'
  - 'moreover'
  - 'furthermore'
  - 'additionally'
  - 'delve'
  - 'seamless(ly)?'
  - 'robust'
  - 'cutting.edge'
  - 'revolutioniz\w+'
  - 'empower\w*'
  - 'unlock the potential'
  - 'at the end of the day'
  - 'industry.leading'
  - 'best.in.class'
  - 'state.of.the.art'
  - 'world.class'
