# Vale cannot express "first use on this page". This fires on every unglossed
# use, so treat a hit as a prompt: check that the FIRST use on the page reads
# "settlement token (stablecoin)", then move on. Later uses drop the gloss by
# design.
extends: existence
message: "Check the first use of 'settlement token' on this page carries the '(stablecoin)' gloss. Later uses do not need it."
level: warning
ignorecase: true
scope: raw
tokens:
  - 'settlement token(?! \(stablecoin\))'
