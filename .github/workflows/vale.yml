name: Style

on:
  push:
  pull_request:

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so a Vale release cannot turn a green build red on its own.
      # Bump deliberately, and run `vale .` locally before you do.
      - name: Install Vale
        run: |
          VALE_VERSION=3.17.0
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C /usr/local/bin vale
          vale --version

      # Errors fail the build. Warnings are printed and do not, because
      # sentence length and the settlement-token gloss need a human to judge.
      - name: Lint prose
        run: vale --minAlertLevel=error .

      - name: Report warnings
        if: always()
        run: vale --minAlertLevel=warning --no-exit .
